  <rect x="205" y="435" width="235" height="12" rx="4" fill="#334155" />
  <rect x="205" y="460" width="200" height="12" rx="4" fill="#334155" />
  <rect x="205" y="485" width="220" height="12" rx="4" fill="#334155" />

