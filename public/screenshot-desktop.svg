  <text x="382" y="264" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Code</text>
  <rect x="480" y="240" width="110" height="38" rx="10" fill="#1e293b" />
  <text x="507" y="264" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Compare</text>
  <rect x="605" y="240" width="110" height="38" rx="10" fill="#1e293b" />
  <text x="632" y="264" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Research</text>

  <rect x="940" y="235" width="140" height="48" rx="12" fill="url(#cyanPurple)" />
  <text x="965" y="265" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800">EXECUTE</text>

